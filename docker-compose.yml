services:
  postgres:
    image: postgres:16-alpine
    container_name: pandemic-tracker-postgres
    environment:
      POSTGRES_DB: pandemic_tracker
      POSTGRES_USER: pandemic_app
      POSTGRES_PASSWORD: pandemic_app
    ports:
      - "5432:5432"
    volumes:
      - pandemic_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandemic_app -d pandemic_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pandemic_tracker_pgdata:
