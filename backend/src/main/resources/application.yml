server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pandemic-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pandemic_tracker}
    username: ${DB_USERNAME:pandemic_app}
    password: ${DB_PASSWORD:pandemic_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
